services:
  ai_backend:
    build: 
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: sosyalag_ai_servisi
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

  frontend_ui:
    image: sosyalag_frontend_env:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sosyalag_frontend_ui
    ports:
      - "3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul
    shm_size: "1gb"
    # İŞTE BURASI YENİ EKLENDİ: Bilgisayarındaki klasörü emülatörün içine canlı olarak bağlar
    volumes:
      - .:/config/workspace/Uludag_Propherty_SosyalAg
    working_dir: /config/workspace/Uludag_Propherty_SosyalAg
    restart: unless-stopped

  compiler:
    image: sosyalag_frontend_env:latest
    volumes:
      - .:/config/workspace/Uludag_Propherty_SosyalAg
    working_dir: /config/workspace/Uludag_Propherty_SosyalAg
    command: /bin/bash -lc "make clean && make"
    restart: "no"